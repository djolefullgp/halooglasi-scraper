services:
  - type: web
    name: halooglasi-scraper
    runtime: node
    plan: free
    buildCommand: npm install && npx playwright install --with-deps
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright-browsers
